
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador IA</title>
    <link rel="stylesheet" href="estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <h1>Clasificador de imágenes IA</h1>
        <p id="estado">Cargando modelo...</p>

        <section class="panel">
            <h2>Clasificar una imagen</h2>
            <input type="file" id="selector-imagen" accept="image/*">
            <img id="vista-previa" alt="Vista previa">
            <button id="analizar">Analizar imagen</button>
        </section>

        <section class="panel">
            <h2>Clasificación por cámara</h2>
            <div id="camara"></div>
            <button id="iniciar">Iniciar cámara</button>
            <button id="detener" disabled>Detener cámara</button>
        </section>

        <section class="panel">
            <label for="umbral">
                Confianza mínima: <span id="valor-umbral">80%</span>
            </label>
            <input type="range" id="umbral"
                   min="10" max="100" value="80">

            <h2>Resultado</h2>
            <p id="resultado">Esperando una imagen...</p>
            <div id="predicciones"></div>
        </section>

        <section class="panel">
            <h2>Historial de resultados</h2>
            <button id="limpiar">Borrar historial</button>
            <ul id="historial"></ul>
        </section>
    </main>
</body>
</html>
